[package]
name = "beep-wasm"
description = "beep-core 의 웹(WASM) 연결부. 계산 로직은 두지 않는다."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
beep-core = { path = "../beep-core" }
js-sys = "0.3.107"
serde_json = "1.0.154"
# xtask 의 wasm-bindgen-cli-support 와 반드시 같은 버전이어야 한다.
wasm-bindgen = "=0.2.130"
