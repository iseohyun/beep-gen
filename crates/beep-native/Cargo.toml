[package]
name = "beep-native"
description = "로컬 환경 어댑터: OS 내장 TTS, URL 다운로드. 계산 로직은 두지 않는다."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
beep-core = { version = "0.1.0", path = "../beep-core" }
serde = { version = "1.0.229", features = ["derive"] }
ureq = "3"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Media_Core", "Media_SpeechSynthesis", "Storage_Streams", "Foundation", "Foundation_Collections"] }
windows-future = "0.3.2"
