name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 도구 준비
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable

      - name: 서식 검사
        run: cargo fmt --all --check

      - name: 린트
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: 테스트
        run: cargo test --workspace

      # 코어에 플랫폼 전용 코드(파일·네트워크·OS 호출, C 의존성)가 섞이면 여기서 실패한다.
      - name: 코어 WASM 빌드
        run: cargo build -p beep-core --target wasm32-unknown-unknown --release

      - name: CLI 릴리즈 빌드
        run: cargo build -p beep-cli --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 기존 Python 구현과 비프 합성 결과가 같은지 확인한다.
      - name: Python 구현과 결과 비교
        run: python tools/parity_check.py target/release/beep-gen
